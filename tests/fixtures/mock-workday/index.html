<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Mock Workday Application</title><link rel="stylesheet" href="styles.css"></head>
  <body>
    <main>
      <h1>Synthetic Workday-style application</h1>
      <section id="personal-information"><h2>Personal information</h2><label>First name <input type="text"></label><label>Email address <input type="email"></label><label>Address <textarea></textarea></label><label>Available date <input type="date"></label></section>
      <section id="education-employment"><h2>Education and employment</h2><label>School <input type="text"></label><label>Start date <input type="date"></label><label>Company <input type="text"></label><label>Job title <input type="text"></label></section>
      <section id="application-questions"><h2>Application questions</h2><fieldset><legend>Are you authorized to work?</legend><label><input type="radio" name="authorized"> Yes</label><label><input type="radio" name="authorized"> No</label></fieldset><label>Tell us something new <textarea></textarea></label></section>
      <section id="voluntary-self-identification"><h2>Voluntary self-identification</h2><label>Gender <select><option>Synthetic</option><option>Decline</option></select></label><label>Disability status <select><option>Synthetic</option><option>Decline</option></select></label><label>Veteran status <select><option>Synthetic</option><option>Decline</option></select></label></section>
      <section id="upload"><h2>Upload</h2><label>Resume <input type="file"></label></section>
      <section id="review"><h2>Review</h2><label><input type="checkbox"> I certify this information</label><button id="submit" type="button">Submit</button><p id="submission-warning" role="alert" hidden></p></section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
